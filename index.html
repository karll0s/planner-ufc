<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">

<title>UFC Planner</title>

<style>
    :root {
        --bg: #0d1117;
        --card: #151a22;
        --text: #eee;
        --primary: #bb86fc;
        --secondary: #00e5ff;
        --success: #00c853;
        --danger: #ff5252;
        --bus: #ffab00;
        --accent: #ff4081;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 600px;
    }

    h1 {
        color: var(--secondary);
        text-align: center;
        margin: 15px 0 20px;
        font-size: 1.8rem;
        letter-spacing: 3px;
        font-weight: 900;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    button,
    input,
    textarea {
        font-family: inherit;
    }

    button {
        background: #1c222d;
        color: #eee;
        border: 1px solid #333;
        padding: 12px 8px;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
        font-size: 0.75rem;
        transition: 0.1s;
        box-shadow: 0 4px 0 #000;
        text-transform: uppercase;
    }

    button:hover {
        filter: brightness(1.12);
    }

    button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #000;
    }

    .menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
        margin-bottom: 25px;
    }

    .btn-config {
        border-color: var(--bus);
        color: var(--bus);
        box-shadow: 0 4px 0 #916200;
    }

    .btn-notes {
        border-color: var(--success);
        color: var(--success);
        box-shadow: 0 4px 0 #007a3d;
    }

    .btn-grades {
        border-color: var(--secondary);
        color: #000;
        background: var(--secondary);
        grid-column: span 2;
        font-size: 0.9rem;
        padding: 16px;
        box-shadow: 0 5px 0 #0097a7;
    }

    .btn-backup {
        border-color: var(--primary);
        color: var(--primary);
        grid-column: span 2;
        box-shadow: 0 4px 0 #4a148c;
    }

    #config-panel,
    #backup-panel {
        display: none;
        background: #1a1f29;
        border-radius: 20px;
        padding: 15px;
        margin-bottom: 20px;
        width: 100%;
        border: 2px solid var(--secondary);
        box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
    }

    #backup-panel {
        border-color: var(--primary);
    }

    .config-box {
        background: rgba(0, 0, 0, 0.2);
        padding: 12px;
        border-radius: 15px;
        margin-bottom: 15px;
        border: 1px solid #333;
    }

    .config-box h4 {
        margin: 0 0 10px 0;
        color: var(--secondary);
        text-transform: uppercase;
        font-size: 0.8rem;
    }

    .config-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
        align-items: center;
    }

    #config-panel input {
        background: #000;
        color: #fff;
        border: 1px solid #444;
        padding: 8px;
        border-radius: 8px;
        font-size: 0.85rem;
        min-width: 0;
    }

    .in-bus {
        flex: 1 1 100%;
        border-color: var(--bus) !important;
        color: var(--bus) !important;
        font-weight: bold;
    }

    .in-time {
        flex: 1 1 65px;
        text-align: center;
    }

    .in-aula {
        flex: 2 1 120px;
    }

    .in-sala {
        flex: 1 1 55px;
        text-align: center;
        color: var(--accent) !important;
        font-weight: bold;
    }

    .btn-del {
        background: none;
        border: none;
        color: var(--danger);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 5px;
        flex-shrink: 0;
        box-shadow: none;
    }

    .btn-del:hover {
        filter: brightness(1.3);
    }

    .quick-add {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        border-radius: 12px;
        border: 1px solid #333;
    }

    .quick-add input[type="text"] {
        flex: 1;
        min-width: 0;
        background: #000;
        color: #fff;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 8px;
        font-size: 0.85rem;
    }

    .quick-add input[type="date"] {
        width: 120px;
        background: #000;
        color: #fff;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 5px;
        font-size: 0.75rem;
    }

    .btn-add-quick {
        background: var(--success);
        color: #000;
        border: none;
        padding: 8px 15px;
        border-radius: 8px;
        box-shadow: 0 3px 0 #007a3d;
        font-size: 1rem;
    }

    .section-title {
        color: var(--primary);
        text-transform: uppercase;
        font-size: 0.85rem;
        margin: 30px 0 12px 0;
        border-bottom: 2px solid var(--primary);
        width: 100%;
        letter-spacing: 2px;
        font-weight: 900;
        padding-bottom: 5px;
    }

    .card {
        background: var(--card);
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 15px;
        border: 1px solid #2a2a2a;
        width: 100%;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .card.today-highlight {
        border: 2px solid var(--secondary);
        background: linear-gradient(
            145deg,
            #151921 0%,
            #1a2b3d 100%
        );
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }

    .today-badge {
        background: var(--secondary);
        color: #000;
        font-size: 0.65rem;
        padding: 3px 10px;
        border-radius: 10px;
        vertical-align: middle;
        margin-left: 10px;
        font-weight: 900;
    }

    .card h2 {
        color: var(--secondary);
        margin: 0 0 12px 0;
        font-size: 1.4rem;
        font-weight: 800;
    }

    .bus-txt {
        color: var(--bus);
        font-size: 0.85rem;
        font-weight: 900;
        margin-bottom: 15px;
        display: block;
        background: rgba(255, 171, 0, 0.1);
        padding: 8px;
        border-radius: 10px;
        border-left: 4px solid var(--bus);
    }

    .aula-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
        padding: 12px 0;
        border-bottom: 1px solid #2a2a2a;
    }

    .aula-item:last-child {
        border-bottom: none;
    }

    .time {
        color: var(--primary);
        font-weight: 900;
        margin-right: 8px;
    }

    .sala {
        color: var(--accent);
        font-weight: 900;
        background: rgba(255, 64, 129, 0.1);
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 0.8rem;
        border: 1px solid rgba(255, 64, 129, 0.2);
        white-space: nowrap;
    }

    textarea {
        width: 100%;
        background: #000;
        color: #eee;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 12px;
        margin-top: 10px;
        min-height: 100px;
        resize: vertical;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 1rem;
    }

    textarea:focus,
    input:focus {
        border-color: var(--secondary);
        outline: none;
    }

    .todo-line {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #222;
    }

    .todo-line:last-child {
        border-bottom: none;
    }

    .todo-line input[type="checkbox"] {
        width: 24px;
        height: 24px;
        accent-color: var(--success);
        cursor: pointer;
        flex-shrink: 0;
    }

    .todo-text {
        flex: 1;
        font-weight: 500;
        overflow-wrap: anywhere;
    }

    .todo-text.done {
        text-decoration: line-through;
        color: #666;
    }

    .todo-date {
        font-size: 0.75rem;
        color: var(--bus);
        font-weight: bold;
        white-space: nowrap;
    }

    .todo-date.today {
        color: var(--secondary);
    }

    .empty-message {
        color: #666;
        font-size: 0.85rem;
        text-align: center;
        padding: 10px;
    }

    .btn-clean {
        background: rgba(255, 82, 82, 0.05);
        border: 1px solid var(--danger);
        color: var(--danger);
        width: 100%;
        margin-top: 15px;
        padding: 10px;
        font-weight: 800;
        border-radius: 12px;
        box-shadow: 0 3px 0 #7e1d1d;
    }

    .config-save {
        background: var(--success);
        color: #000;
        border: none;
        width: 100%;
        margin: 30px 0 10px 0;
        padding: 20px;
        border-radius: 12px;
        font-weight: 900;
        font-size: 1rem;
        box-shadow: 0 5px 0 #007a3d;
    }

    .btn-close {
        margin-top: 15px;
        border: none;
        background: none;
        color: #666;
        font-weight: bold;
        cursor: pointer;
        box-shadow: none;
        width: 100%;
    }

    .backup-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    .backup-actions button {
        flex: 1;
    }

    .backup-info {
        color: #888;
        font-size: 0.75rem;
        text-align: center;
        margin-top: 12px;
    }

    .status-message {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%) translateY(100px);
        background: #1c222d;
        color: #fff;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid #333;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        opacity: 0;
        transition: 0.25s;
        z-index: 9999;
        font-size: 0.85rem;
        text-align: center;
        max-width: calc(100% - 30px);
    }

    .status-message.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }

    #importFile {
        display: none;
    }

    @media (max-width: 480px) {
        body {
            padding: 8px;
        }

        .menu {
            gap: 9px;
        }

        button {
            font-size: 0.7rem;
        }

        .quick-add {
            flex-wrap: wrap;
        }

        .quick-add input[type="text"] {
            flex: 1 1 100%;
        }

        .quick-add input[type="date"] {
            flex: 1;
            width: auto;
        }

        .btn-add-quick {
            flex: 0 0 50px;
        }

        .aula-item {
            align-items: flex-start;
        }

        .todo-line {
            gap: 8px;
        }

        .todo-date {
            font-size: 0.68rem;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>UFC</h1>

    <div class="menu">
        <button
            class="btn-grades"
            onclick="irParaNotas()">
            📊 Pontuações e Médias
        </button>

        <button
            class="btn-config"
            onclick="toggleConfig()">
            ⚙️ Configurações
        </button>

        <button
            class="btn-notes"
            onclick="baixarRelatorioHTML()">
            🌐 Exportar Relatório (.html)
        </button>
        
        <button
            class="btn-backup"
            onclick="toggleBackup()">
            📂 Backup do Semestre
        </button>
    </div>

    <!-- BACKUP -->

    <div id="backup-panel">

        <h3 style="margin-top:0; color:var(--secondary)">
            Backup Completo
        </h3>

        <div class="backup-actions">

            <button
                onclick="baixarEstrutura()"
                style="border-color:var(--success); color:var(--success)">
                📤 Exportar
            </button>

            <button
                onclick="document.getElementById('importFile').click()"
                style="border-color:var(--secondary); color:var(--secondary)">
                📥 Importar
            </button>

            <input
                type="file"
                id="importFile"
                accept=".json,application/json"
                onchange="importarBackup(this)"
            >

        </div>

        <div class="backup-info">
            O backup inclui cronograma, tarefas e anotações.
        </div>

        <button
            onclick="toggleBackup()"
            class="btn-close">
            [ FECHAR ]
        </button>

    </div>

    <!-- CONFIGURAÇÕES -->

    <div id="config-panel">

        <h3 style="margin-top:0; color:var(--bus)">
            ⚙️ Editar Cronograma
        </h3>

        <div id="dias-editor"></div>

        <h3 style="color:var(--secondary)">
            📚 Matérias
        </h3>

        <div id="mats-editor"></div>

        <button
            onclick="addItem()"
            style="width:100%; padding:12px; margin-top:10px; border-color:var(--secondary)">
            + Nova Matéria
        </button>

        <button
            class="config-save"
            onclick="salvarEFechar()">
            ✅ SALVAR TUDO
        </button>

    </div>

    <!-- CONTEÚDO -->

    <div id="render-area"></div>

</div>

<div id="status-message" class="status-message"></div>

<script>
/* =========================================================
   UFC PLANNER V7
   ========================================================= */

const STORAGE_KEY = 'ufc_planner_data_v7';
const OLD_STORAGE_KEY = 'ufc_planner_data_v6_9';
const NOTES_STORAGE_KEY = 'ufc_sistema_notas_v1';

const defaultData = {
    version: 7,

    dias: [
        {
            nome: "Segunda",
            bus: "16:15 ➔ 21:40",
            aulas: [
                ["17:30", "Matéria 1", "S01"]
            ]
        },
        {
            nome: "Terça",
            bus: "12:20 ➔ 17:40",
            aulas: [
                ["13:00", "Matéria 2", "S02"]
            ]
        },
        {
            nome: "Quarta",
            bus: "12:20 ➔ 15:20",
            aulas: [
                ["13:00", "Matéria 2", "S02"]
            ]
        },
        {
            nome: "Quinta",
            bus: "16:15 ➔ 21:40",
            aulas: [
                ["17:30", "Matéria 3", "S03"]
            ]
        },
        {
            nome: "Sexta",
            bus: "12:20 ➔ 19:40",
            aulas: [
                ["13:00", "Matéria 1", "S01"]
            ]
        }
    ],

    materias: [
        {
            id: "mat-001",
            nome: "Matéria 1"
        },
        {
            id: "mat-002",
            nome: "Matéria 2"
        }
    ],

    todos: []
};


/* =========================================================
   UTILITÁRIOS
   ========================================================= */

function gerarId(prefixo = 'id') {

    if (
        typeof crypto !== 'undefined' &&
        typeof crypto.randomUUID === 'function'
    ) {
        return `${prefixo}-${crypto.randomUUID()}`;
    }

    return `${prefixo}-${Date.now()}-${Math.random()
        .toString(36)
        .substring(2, 10)}`;
}


function escapeHTML(valor) {

    return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


function escapeAttribute(valor) {
    return escapeHTML(valor);
}


function clonarPadrao() {
    return structuredClone(defaultData);
}


function mostrarStatus(mensagem, tempo = 2500) {

    const el = document.getElementById('status-message');

    el.textContent = mensagem;
    el.classList.add('show');

    clearTimeout(mostrarStatus.timeout);

    mostrarStatus.timeout = setTimeout(() => {
        el.classList.remove('show');
    }, tempo);
}


/* =========================================================
   STORAGE
   ========================================================= */

function salvarDados() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(dados)
        );

    } catch (erro) {

        console.error(
            'Erro ao salvar dados:',
            erro
        );

        alert(
            'Não foi possível salvar os dados. ' +
            'O armazenamento do navegador pode estar cheio.'
        );
    }
}


function carregarDados() {

    try {

        const atual = localStorage.getItem(STORAGE_KEY);

        if (atual) {

            const parsed = JSON.parse(atual);

            if (validarDados(parsed)) {
                return normalizarDados(parsed);
            }
        }

        /*
         * Migração automática da versão antiga.
         */

        const antigo = localStorage.getItem(
            OLD_STORAGE_KEY
        );

        if (antigo) {

            const parsedAntigo = JSON.parse(antigo);

            const migrado = migrarVersaoAntiga(
                parsedAntigo
            );

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(migrado)
            );

            mostrarStatus(
                '✅ Dados antigos migrados para a versão 7'
            );

            return migrado;
        }

    } catch (erro) {

        console.error(
            'Erro ao carregar dados:',
            erro
        );

        alert(
            'Os dados salvos estavam inválidos. ' +
            'O sistema iniciou com uma estrutura limpa.'
        );
    }

    return clonarPadrao();
}


function validarDados(obj) {

    if (!obj || typeof obj !== 'object') {
        return false;
    }

    if (!Array.isArray(obj.dias)) {
        return false;
    }

    if (!Array.isArray(obj.materias)) {
        return false;
    }

    if (!Array.isArray(obj.todos)) {
        return false;
    }

    return true;
}


function normalizarDados(obj) {

    const resultado = {
        version: 7,

        dias: Array.isArray(obj.dias)
            ? obj.dias
            : [],

        materias: [],

        todos: Array.isArray(obj.todos)
            ? obj.todos
            : []
    };


    /*
     * Normaliza matérias.
     */

    resultado.materias = obj.materias
        .map((materia, index) => {

            if (typeof materia === 'string') {

                return {
                    id: gerarId('mat'),
                    nome: materia
                };
            }

            return {
                id: materia.id || gerarId('mat'),
                nome: String(
                    materia.nome || `Matéria ${index + 1}`
                )
            };

        })
        .filter(m => m.nome.trim() !== '');


    /*
     * Normaliza tarefas.
     */

    resultado.todos = obj.todos.map(tarefa => {

        return {
            id: tarefa.id || gerarId('todo'),

            texto: String(
                tarefa.texto || ''
            ),

            data: tarefa.data || '',

            concluida:
                tarefa.concluida === true
        };

    }).filter(t => t.texto.trim() !== '');


    /*
     * Normaliza dias/aulas.
     */

    resultado.dias = resultado.dias.map(dia => {

        return {
            nome: String(dia.nome || ''),
            bus: String(dia.bus || ''),

            aulas: Array.isArray(dia.aulas)
                ? dia.aulas.map(aula => [
                    String(aula[0] || ''),
                    String(aula[1] || ''),
                    String(aula[2] || '')
                ])
                : []
        };

    });

    return resultado;
}


/* =========================================================
   MIGRAÇÃO V6.9 → V7
   ========================================================= */

function migrarVersaoAntiga(antigo) {

    const novo = {
        version: 7,

        dias: Array.isArray(antigo.dias)
            ? antigo.dias
            : clonarPadrao().dias,

        materias: [],

        todos: []
    };


    /*
     * Converte matérias:
     *
     * "Cálculo"
     *
     * para:
     *
     * {
     *   id: "mat-...",
     *   nome: "Cálculo"
     * }
     */

    const materiasAntigas =
        Array.isArray(antigo.materias)
            ? antigo.materias
            : [];


    materiasAntigas.forEach(nome => {

        novo.materias.push({
            id: gerarId('mat'),
            nome: String(nome)
        });

    });


    /*
     * Converte tarefas e tenta recuperar
     * o estado antigo dos checkboxes.
     */

    const todosAntigos =
        Array.isArray(antigo.todos)
            ? antigo.todos
            : [];


    todosAntigos.forEach((tarefa, index) => {

        novo.todos.push({

            id: gerarId('todo'),

            texto: String(
                tarefa.texto || ''
            ),

            data: tarefa.data || '',

            concluida:
                localStorage.getItem(
                    `chk-${index}`
                ) === 'true'

        });

    });


    /*
     * Migra as anotações antigas de matéria.
     *
     * not-Cálculo
     *
     * para:
     *
     * not-mat-UUID
     */

    novo.materias.forEach(materia => {

        const chaveAntiga =
            `not-${materia.nome}`;

        const chaveNova =
            `not-${materia.id}`;

        const anotacao =
            localStorage.getItem(chaveAntiga);

        if (
            anotacao !== null &&
            localStorage.getItem(chaveNova) === null
        ) {

            localStorage.setItem(
                chaveNova,
                anotacao
            );
        }

    });


    return novo;
}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

function irParaNotas() {

    /*
     * notas.html continua recebendo apenas
     * os nomes das matérias.
     */

    const nomesMaterias = dados.materias.map(
        materia => materia.nome
    );

    localStorage.setItem(
        'ufc_materias_transporte',
        JSON.stringify(nomesMaterias)
    );

    window.location.href = 'notas.html';
}


/* =========================================================
   RENDERIZAÇÃO
   ========================================================= */

function desenharTudo() {

    const area =
        document.getElementById('render-area');

    let html = '';

    const agora = new Date();

    const hojeData =
        agora.getFullYear() +
        '-' +
        String(agora.getMonth() + 1).padStart(2, '0') +
        '-' +
        String(agora.getDate()).padStart(2, '0');

    const hojeNome = [
        "Domingo",
        "Segunda",
        "Terça",
        "Quarta",

/* =========================================================
   DATAS
   ========================================================= */

function formatarData(data) {

    if (!data) return '';

    const partes =
        data.split('-');

    if (partes.length !== 3) {
        return data;
    }

    const ano =
        Number(partes[0]);

    const mes =
        Number(partes[1]);

    const dia =
        Number(partes[2]);

    const dataLocal =
        new Date(
            ano,
            mes - 1,
            dia
        );

    return new Intl.DateTimeFormat(
        'pt-BR'
    ).format(dataLocal);
}


/* =========================================================
   TAREFAS
   ========================================================= */

function addTodoRapido() {

    const input =
        document.getElementById(
            'new-todo-text'
        );

    const dataInput =
        document.getElementById(
            'new-todo-date'
        );

    const texto =
        input.value.trim();

    const data =
        dataInput.value;


    if (!texto) {

        input.focus();

        return;
    }


    dados.todos.push({

        id: gerarId('todo'),

        texto,

        data,

        concluida: false

    });


    salvarDados();

    desenharTudo();

    mostrarStatus(
        '✅ Tarefa adicionada'
    );
}


function alternarTodo(id, concluida) {

    const tarefa =
        dados.todos.find(
            t => t.id === id
        );

    if (!tarefa) return;

    tarefa.concluida =
        Boolean(concluida);

    salvarDados();

    desenharTudo();
}


function removerTodo(id) {

    const index =
        dados.todos.findIndex(
            t => t.id === id
        );

    if (index === -1) return;


    const tarefa =
        dados.todos[index];


    if (
        !confirm(
            `Remover a tarefa "${tarefa.texto}"?`
        )
    ) {
        return;
    }


    dados.todos.splice(index, 1);

    salvarDados();

    desenharTudo();

    mostrarStatus(
        '🗑️ Tarefa removida'
    );
}


function limparConcluidos() {

    const quantidade =
        dados.todos.filter(
            t => t.concluida
        ).length;


    if (quantidade === 0) {

        mostrarStatus(
            'Não há tarefas concluídas.'
        );

        return;
    }


    if (
        !confirm(
            `Remover ${quantidade} tarefa(s) concluída(s)?`
        )
    ) {
        return;
    }


    dados.todos =
        dados.todos.filter(
            t => !t.concluida
        );


    salvarDados();

    desenharTudo();

    mostrarStatus(
        '🧹 Tarefas concluídas removidas'
    );
}


/* =========================================================
   ANOTAÇÕES
   ========================================================= */

function recuperarNotas() {

    document
        .querySelectorAll('textarea')
        .forEach(textarea => {

            const valor =
                localStorage.getItem(
                    textarea.id
                );

            textarea.value =
                valor || '';


            textarea.addEventListener(
                'input',
                () => {

                    localStorage.setItem(
                        textarea.id,
                        textarea.value
                    );

                }
            );

        });
}


/* =========================================================
   BACKUP
   ========================================================= */

function coletarAnotacoes() {

    const notas = {};

    for (
        let i = 0;
        i < localStorage.length;
        i++
    ) {

        const chave =
            localStorage.key(i);

        if (
            chave &&
            chave.startsWith('not-')
        ) {

            notas[chave] =
                localStorage.getItem(chave);
        }
    }

    return notas;
}


function baixarEstrutura() {

    const backup = {

        version: 7,

        app: 'UFC Planner',

        exportedAt:
            new Date().toISOString(),

        planner: dados,

        notas: coletarAnotacoes(),

        notasSistema:
            JSON.parse(
                localStorage.getItem(
                    NOTES_STORAGE_KEY
                ) || '{}'
            )

    };


    const blob =
        new Blob(
            [
                '\ufeff' +
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    'application/json;charset=utf-8'
            }
        );


    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement('a');

    link.href = url;

    link.download =
        `backup_ufc_planner_${
            obterDataArquivo()
        }.json`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);


    mostrarStatus(
        '📤 Backup exportado'
    );
}


function validarBackup(backup) {

    if (
        !backup ||
        typeof backup !== 'object'
    ) {
        return false;
    }

    if (
        backup.version !== 7
    ) {
        return false;
    }

    if (
        !backup.planner ||
        !validarDados(backup.planner)
    ) {
        return false;
    }

    return true;
}


function importarBackup(input) {

    const arquivo =
        input.files?.[0];

    if (!arquivo) return;


    const reader =
        new FileReader();


    reader.onload = event => {

        try {

            const backup =
                JSON.parse(
                    event.target.result
                );


            if (
                !validarBackup(backup)
            ) {

                alert(
                    '❌ Este arquivo não é um backup válido do UFC Planner V7.'
                );

                return;
            }


            const confirmar =
                confirm(
                    'Restaurar este backup?\n\n' +
                    'Os dados atuais do UFC Planner serão substituídos.'
                );


            if (!confirmar) {
                return;
            }


            /*
             * Primeiro normaliza os dados.
             */

            dados =
                normalizarDados(
                    backup.planner
                );


            /*
             * Remove somente as chaves
             * pertencentes ao UFC Planner.
             */

            removerDadosDoAplicativo();


            /*
             * Salva o novo planner.
             */

            salvarDados();


            /*
             * Restaura anotações.
             */

            if (
                backup.notas &&
                typeof backup.notas === 'object'
            ) {

                Object.entries(
                    backup.notas
                ).forEach(
                    ([chave, valor]) => {

                        if (
                            chave.startsWith('not-')
                        ) {

                            localStorage.setItem(
                                chave,
                                String(valor ?? '')
                            );
                        }

                    }
                );
            }


            /*
             * Restaura sistema de notas.
             */

            if (
                backup.notasSistema &&
                typeof backup.notasSistema === 'object'
            ) {

                localStorage.setItem(
                    NOTES_STORAGE_KEY,
                    JSON.stringify(
                        backup.notasSistema
                    )
                );
            }


            desenharTudo();

            mostrarStatus(
                '✅ Backup restaurado',
                3500
            );


        } catch (erro) {

            console.error(
                'Erro ao importar backup:',
                erro
            );

            alert(
                '❌ Não foi possível ler o arquivo de backup.'
            );

        } finally {

            /*
             * Permite importar o mesmo arquivo
             * novamente se necessário.
             */

            input.value = '';
        }
    };


    reader.readAsText(
        arquivo,
        'UTF-8'
    );
}


function removerDadosDoAplicativo() {

    const chavesRemover = [];

    for (
        let i = 0;
        i < localStorage.length;
        i++
    ) {

        const chave =
            localStorage.key(i);

        if (!chave) continue;


        if (
            chave === STORAGE_KEY ||
            chave === OLD_STORAGE_KEY ||
            chave === 'ufc_materias_transporte' ||
            chave.startsWith('not-')
        ) {

            chavesRemover.push(chave);
        }
    }


    chavesRemover.forEach(
        chave =>
            localStorage.removeItem(chave)
    );
}

    height: 28px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    border-radius: 50%;

    border: 2px solid var(--green);

    color: var(--green);

    font-weight: 900;

}


.task-done .task-check {

    background: var(--green);

    color: #000;

}


.task-text {

    font-weight: 650;

    overflow-wrap: anywhere;

}


.task-done .task-text {

    color: #777;

    text-decoration: line-through;

}


.prazo {

    display: inline-block;

    margin-top: 5px;

    color: var(--yellow);

    font-size: .78rem;

    font-weight: 800;

}


.prazo.hoje {
    color: var(--cyan);
}


.prazo.atrasada {
    color: var(--red);
}


/* =====================================================
   CRONOGRAMA
   ===================================================== */

.day-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 15px;

}


.day-name {

    color: var(--cyan);

    font-size: 1.35rem;

    font-weight: 900;

}


.bus {

    color: var(--yellow);

    background:
        rgba(255,171,0,.1);

    border:
        1px solid
        rgba(255,171,0,.25);

    border-radius: 10px;

    padding: 6px 10px;

    font-size: .78rem;

    font-weight: 800;

}


.class-head,
.class-row {

    display: grid;

    grid-template-columns:
        80px 1fr 80px;

    gap: 10px;

    align-items: center;

}


.class-head {

    color: var(--muted);

    font-size: .65rem;

    font-weight: 900;

    letter-spacing: 1px;

    padding-bottom: 7px;

}


.class-row {

    padding: 12px 0;

    border-top:
        1px solid var(--border);

}


.class-time {

    color: var(--purple);

    font-weight: 900;

}


.class-name {

    font-weight: 600;

    overflow-wrap: anywhere;

}


.class-room {

    color: var(--pink);

    text-align: right;

    font-size: .8rem;

    font-weight: 900;

}


/* =====================================================
   ANOTAÇÕES
   ===================================================== */

.notes-card h3 {

    margin-top: 0;

    color: var(--cyan);

}


.notes {

    white-space: normal;

    overflow-wrap: anywhere;

    color: #ddd;

    line-height: 1.7;

}


/* =====================================================
   VAZIO
   ===================================================== */

.empty {

    color: var(--muted);

    text-align: center;

    padding: 15px;

    font-size: .85rem;

}


/* =====================================================
   RODAPÉ
   ===================================================== */

.footer {

    text-align: center;

    color: var(--muted);

    font-size: .75rem;

    padding: 30px 10px 10px;

}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }


    .header {
        padding: 25px 15px;
    }


    .logo {
        font-size: 2rem;
    }


    .summary {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .stat:last-child {

        grid-column:
            span 2;

    }


    .card,
    .day-card,
    .notes-card {

        padding: 15px;

    }


    .day-header {

        align-items: flex-start;

        flex-direction: column;

    }


    .bus {

        width: 100%;

    }


    .class-head,
    .class-row {

        grid-template-columns:
            58px 1fr;

    }


    .class-head span:last-child {
        display: none;
    }


    .class-room {

        grid-column: 2;

        text-align: left;

        margin-top: -8px;

    }

}


/* =====================================================
   IMPRESSÃO
   ===================================================== */

@media print {

    body {

        background: white;

        color: black;

        padding: 0;

    }


    .header,
    .card,
    .day-card,
    .notes-card,
    .stat {

        box-shadow: none;

        background: white;

        color: black;

        border-color: #ccc;

    }


    .logo,
    .day-name,
    .notes-card h3 {

        color: #111;

    }


    .section {

        color: #111;

        border-color: #111;

    }


    .task,
    .class-row {

        border-color: #ddd;

    }

}

/* =========================================================
   CONFIGURAÇÕES
   ========================================================= */

function toggleBackup() {

    const painel =
        document.getElementById(
            'backup-panel'
        );

    painel.style.display =
        painel.style.display === 'block'
            ? 'none'
            : 'block';
}


function toggleConfig() {

    const painel =
        document.getElementById(
            'config-panel'
        );


    const abrir =
        painel.style.display !== 'block';


    painel.style.display =
        abrir
            ? 'block'
            : 'none';


    if (abrir) {
        abrirEditor();
    }
}


function abrirEditor() {

    const diasEditor =
        document.getElementById(
            'dias-editor'
        );

    const materiasEditor =
        document.getElementById(
            'mats-editor'
        );


    diasEditor.innerHTML = '';


    /* =====================================================
       DIAS
       ===================================================== */

    dados.dias.forEach(
        (dia, diaIndex) => {

            let diaHTML = `
                <div class="config-box">

                    <h4>
                        ${escapeHTML(dia.nome)}
                    </h4>

                    <div class="config-row">
                        🚌

                        <input
                            type="text"
                            class="in-bus"
                            value="${escapeAttribute(dia.bus)}"
                            placeholder="Horário do ônibus"
                            oninput="atualizarBus(
                                ${diaIndex},
                                this.value
                            )"
                        >
                    </div>
            `;


            dia.aulas.forEach(
                (aula, aulaIndex) => {

                    diaHTML += `
                        <div class="config-row">

                            <input
                                type="text"
                                class="in-time"
                                placeholder="Hora"
                                value="${escapeAttribute(aula[0])}"
                                oninput="atualizarAula(
                                    ${diaIndex},
                                    ${aulaIndex},
                                    0,
                                    this.value
                                )"
                            >

                            <input
                                type="text"
                                class="in-aula"
                                placeholder="Aula"
                                value="${escapeAttribute(aula[1])}"
                                oninput="atualizarAula(
                                    ${diaIndex},
                                    ${aulaIndex},
                                    1,
                                    this.value
                                )"
                            >

                            <input
                                type="text"
                                class="in-sala"
                                placeholder="Sala"
                                value="${escapeAttribute(aula[2])}"
                                oninput="atualizarAula(
                                    ${diaIndex},
                                    ${aulaIndex},
                                    2,
                                    this.value
                                )"
                            >

                            <button
                                class="btn-del"
                                onclick="removerAula(
                                    ${diaIndex},
                                    ${aulaIndex}
                                )">
                                ✕
                            </button>

                        </div>
                    `;
                }
            );


            diaHTML += `
                    <button
                        onclick="adicionarAula(
                            ${diaIndex}
                        )"
                        style="
                            width:100%;
                            font-size:0.75rem;
                            box-shadow:none;
                            margin-top:5px;
                        ">
                        + Adicionar Aula
                    </button>

                </div>
            `;


            diasEditor.innerHTML += diaHTML;
        }
    );


    /* =====================================================
       MATÉRIAS
       ===================================================== */

    materiasEditor.innerHTML = '';


    dados.materias.forEach(
        (materia, index) => {

            materiasEditor.innerHTML += `
                <div class="config-row">

                    <input
                        type="text"
                        value="${escapeAttribute(materia.nome)}"
                        oninput="atualizarMateria(
                            ${index},
                            this.value
                        )"
                        style="flex:1"
                        placeholder="Nome da matéria"
                    >

                    <button
                        class="btn-del"
                        onclick="removerMateria(
                            ${index}
                        )">
                        ✕
                    </button>

                </div>
            `;
        }
    );
}


/* =========================================================
   EDITOR - DIAS
   ========================================================= */

function atualizarBus(
    diaIndex,
    valor
) {

    if (
        !dados.dias[diaIndex]
    ) return;

    dados.dias[diaIndex].bus =
        valor;
}


function atualizarAula(
    diaIndex,
    aulaIndex,
    campo,
    valor
) {

    if (
        !dados.dias[diaIndex] ||
        !dados.dias[diaIndex].aulas[aulaIndex]
    ) {
        return;
    }

    dados.dias[diaIndex]
        .aulas[aulaIndex][campo] =
        valor;
}


function adicionarAula(diaIndex) {

    if (!dados.dias[diaIndex]) {
        return;
    }

    dados.dias[diaIndex]
        .aulas.push([
            '',
            '',
            ''
        ]);

    abrirEditor();
}


function removerAula(
    diaIndex,
    aulaIndex
) {

    if (
        !dados.dias[diaIndex]
    ) {
        return;
    }

    dados.dias[diaIndex]
        .aulas.splice(
            aulaIndex,
            1
        );

    abrirEditor();
}


/* =========================================================
   EDITOR - MATÉRIAS
   ========================================================= */

function atualizarMateria(
    index,
    valor
) {

    if (
        !dados.materias[index]
    ) {
        return;
    }

    dados.materias[index].nome =
        valor;
}


function removerMateria(index) {

    const materia =
        dados.materias[index];

    if (!materia) return;


    if (
        !confirm(
            `Remover a matéria "${materia.nome}"?`
        )
    ) {
        return;
    }


    dados.materias.splice(
        index,
        1
    );


    /*
     * A anotação continua armazenada.
     *
     * Isso permite recuperar posteriormente
     * caso o usuário adicione novamente uma
     * matéria com outro ID? Não.
     *
     * Por segurança, removemos também a anotação
     * associada a esta matéria.
     */

    localStorage.removeItem(
        `not-${materia.id}`
    );


    abrirEditor();
}


function addItem() {

    dados.materias.push({

        id: gerarId('mat'),

        nome: 'Nova Matéria'

    });


    abrirEditor();
}


function salvarEFechar() {

    /*
     * Remove matérias vazias.
     */

    dados.materias =
        dados.materias.filter(
            materia =>
                materia.nome.trim() !== ''
        );


    /*
     * Remove aulas completamente vazias.
     */

    dados.dias.forEach(
        dia => {

            dia.aulas =
                dia.aulas.filter(
                    aula =>
                        aula.some(
                            valor =>
                                String(valor).trim() !== ''
                        )
                );

        }
    );


    salvarDados();

    desenharTudo();

    document.getElementById(
        'config-panel'
    ).style.display = 'none';


    mostrarStatus(
        '✅ Configurações salvas'
    );
}


/* =========================================================
   UTILITÁRIOS DE ARQUIVO
   ========================================================= */

function obterDataArquivo() {

    const agora =
        new Date();

    return [
        agora.getFullYear(),
        String(
            agora.getMonth() + 1
        ).padStart(2, '0'),
        String(
            agora.getDate()
        ).padStart(2, '0')
    ].join('-');
}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

let dados = carregarDados();

window.addEventListener(
    'DOMContentLoaded',
    () => {

        desenharTudo();

    }
);
</script>
