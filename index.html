<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0d1117"
>

<title>Histórico de Notas - UFC</title>

<style>

/* =====================================================
   VARIÁVEIS
   ===================================================== */

:root {

    --bg: #0d1117;
    --card: #151a22;
    --card-2: #1a1f29;

    --text: #eee;
    --muted: #777;

    --primary: #7c4dff;
    --secondary: #00e5ff;

    --success: #00c853;
    --warning: #ffab00;
    --danger: #ff5252;

    --border: #2a2a2a;

}


/* =====================================================
   RESET
   ===================================================== */

* {

    box-sizing: border-box;

}


html {

    width: 100%;
    min-height: 100%;

}


body {

    font-family:
        'Segoe UI',
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background:

        radial-gradient(
            circle at top,
            rgba(124,77,255,.10),
            transparent 35%
        ),

        var(--bg);

    color: var(--text);

    margin: 0;

    padding:
        12px;

    min-height: 100vh;

}


/* =====================================================
   CONTAINER
   ===================================================== */

.container {

    width: 100%;

    max-width: 700px;

    margin: auto;

}


/* =====================================================
   TÍTULO
   ===================================================== */

h1 {

    color:
        var(--secondary);

    text-align:
        center;

    margin:
        15px 0 20px;

    font-size:
        clamp(
            1.25rem,
            5vw,
            1.7rem
        );

    letter-spacing:
        2px;

    font-weight:
        900;

    text-shadow:
        0 0 10px
        rgba(0,229,255,.3);

}


/* =====================================================
   BOTÕES
   ===================================================== */

button {

    background:
        #1c222d;

    color:
        #eee;

    border:
        1px solid #333;

    padding:
        12px;

    border-radius:
        12px;

    font-weight:
        800;

    cursor:
        pointer;

    font-size:
        .78rem;

    transition:
        .12s;

    box-shadow:
        0 4px 0 #000;

    text-transform:
        uppercase;

}


button:hover {

    filter:
        brightness(1.12);

}


button:active {

    transform:
        translateY(3px);

    box-shadow:
        0 1px 0 #000;

}


.top-menu {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        10px;

    width:
        100%;

    margin-bottom:
        22px;

}


.btn-back {

    border-color:
        var(--primary);

    color:
        var(--primary);

    box-shadow:
        0 4px 0 #4a148c;

}


.btn-download {

    border-color:
        var(--success);

    color:
        var(--success);

    box-shadow:
        0 4px 0 #007a3d;

}


/* =====================================================
   SEMESTRE
   ===================================================== */

.semestre-area {

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    margin-bottom:
        25px;

}


.semestre-label {

    color:
        #888;

    font-size:
        .75rem;

    font-weight:
        800;

    text-transform:
        uppercase;

    margin-bottom:
        7px;

}


.semestre-input {

    background:
        #000;

    border:
        2px solid var(--primary);

    border-radius:
        15px;

    color:
        var(--primary);

    text-align:
        center;

    font-weight:
        900;

    width:
        150px;

    padding:
        10px;

    font-size:
        1rem;

    box-shadow:
        0 4px 0 #4a148c;

}


/* =====================================================
   RESUMO
   ===================================================== */

.resumo {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        8px;

    margin-bottom:
        25px;

}


.resumo-box {

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius:
        15px;

    padding:
        12px 6px;

    text-align:
        center;

}


.resumo-numero {

    display:
        block;

    color:
        var(--secondary);

    font-size:
        1.35rem;

    font-weight:
        900;

}


.resumo-label {

    color:
        #888;

    font-size:
        .65rem;

    font-weight:
        800;

    text-transform:
        uppercase;

}


/* =====================================================
   MATÉRIA
   ===================================================== */

.materia-card {

    background:

        linear-gradient(
            145deg,
            #151a22,
            #11161d
        );

    border-radius:
        20px;

    padding:
        18px;

    margin-bottom:
        22px;

    border:
        1px solid var(--border);

    width:
        100%;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.4);

    overflow:
        hidden;

}


.materia-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

    border-bottom:
        2px solid var(--border);

    padding-bottom:
        12px;

    margin-bottom:
        15px;

}


.materia-header > div:first-child {

    min-width:
        0;

}


.materia-title {

    color:
        var(--secondary);

    font-size:
        clamp(
            1rem,
            4vw,
            1.25rem
        );

    font-weight:
        900;

    margin:
        0;

    overflow-wrap:
        anywhere;

}


.materia-id {

    color:
        #555;

    font-size:
        .6rem;

    overflow-wrap:
        anywhere;

}


.btn-delete-materia {

    background:
        transparent;

    color:
        var(--danger);

    border:
        none;

    box-shadow:
        none;

    padding:
        5px;

    font-size:
        1.1rem;

    flex-shrink:
        0;

}


/* =====================================================
   ETAPA
   ===================================================== */

.np-box {

    background:
        rgba(0,0,0,.2);

    border-radius:
        15px;

    padding:
        14px;

    margin-bottom:
        15px;

    border:
        1px solid #333;

    border-left:
        5px solid var(--primary);

    overflow:
        hidden;

}


.np-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        8px;

    margin-bottom:
        12px;

    color:
        var(--primary);

    font-weight:
        900;

}


.np-title {

    flex:
        1;

    min-width:
        0;

    background:
        transparent;

    border:
        none;

    border-bottom:
        1px solid #444;

    border-radius:
        0;

    color:
        var(--primary);

    font-weight:
        900;

    padding:
        5px;

}


.np-title:focus {

    outline:
        none;

    border-color:
        var(--secondary);

}


/* =====================================================
   INPUTS
   ===================================================== */

input {

    background:
        #000;

    color:
        #fff;

    border:
        1px solid #444;

    padding:
        9px;

    border-radius:
        9px;

    font-size:
        .82rem;

    width:
        100%;

    font-weight:
        600;

}


input:focus {

    border-color:
        var(--secondary);

    outline:
        none;

}


/* =====================================================
   LINHA DE NOTA
   ===================================================== */

.nota-row {

    display:
        grid;

    grid-template-columns:
        minmax(0, 1fr)
        65px
        65px
        32px;

    gap:
        6px;

    margin-bottom:
        8px;

    align-items:
        center;

}


.btn-del-small {

    background:
        none;

    border:
        none;

    color:
        var(--danger);

    cursor:
        pointer;

    font-size:
        1.1rem;

    box-shadow:
        none;

    padding:
        2px;

}


/* =====================================================
   MÉDIA DA ETAPA
   ===================================================== */

.media-etapa {

    text-align:
        right;

    font-size:
        .85rem;

    margin-top:
        10px;

    font-weight:
        900;

}


.media-boa {

    color:
        var(--success);

}


.media-baixa {

    color:
        var(--warning);

}


.media-ruim {

    color:
        var(--danger);

}


/* =====================================================
   PREVISÃO
   ===================================================== */

.previsao-tag {

    background:
        rgba(124,77,255,.1);

    color:
        var(--primary);

    border:
        1px dashed var(--primary);

    padding:
        10px;

    border-radius:
        12px;

    font-size:
        .8rem;

    margin-top:
        10px;

    font-weight:
        800;

    text-align:
        center;

}


.previsao-impossivel {

    color:
        var(--danger);

    border-color:
        var(--danger);

    background:
        rgba(255,82,82,.08);

}


/* =====================================================
   BOTÕES ETAPAS
   ===================================================== */

.btn-add-nota {

    width:
        100%;

    font-size:
        .7rem;

    margin-top:
        10px;

    padding:
        9px;

    border-style:
        dashed;

    box-shadow:
        none;

}


.btn-add-np {

    background:
        var(--primary);

    color:
        #fff;

    border:
        none;

    margin-top:
        2px;

    width:
        100%;

    border-radius:
        12px;

    box-shadow:
        0 4px 0 #4a148c;

}


/* =====================================================
   RESULTADO
   ===================================================== */

.media-final-area {

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    margin-top:
        18px;

    padding-top:
        15px;

    border-top:
        1px dashed #444;

    gap:
        10px;

}


.media-final {

    font-size:
        1.2rem;

    font-weight:
        900;

    text-align:
        center;

}


.media-final span {

    color:
        var(--secondary);

    font-size:
        1.5rem;

}


.status-badge {

    padding:
        9px 20px;

    border-radius:
        12px;

    font-size:
        .75rem;

    font-weight:
        900;

    letter-spacing:
        1px;

    color:
        #000;

    text-align:
        center;

}


.aprovado {

    background:
        var(--success);

    box-shadow:
        0 4px 0 #007a3d;

}


.recuperacao {

    background:
        var(--warning);

    box-shadow:
        0 4px 0 #916200;

}


.reprovado {

    background:
        var(--danger);

    color:
        #fff;

    box-shadow:
        0 4px 0 #7e1d1d;

}


.info-af {

    width:
        100%;

    background:
        rgba(255,171,0,.08);

    border:
        1px solid
        rgba(255,171,0,.25);

    color:
        var(--warning);

    border-radius:
        12px;

    padding:
        10px;

    font-size:
        .78rem;

    text-align:
        center;

    font-weight:
        800;

}


/* =====================================================
   VAZIO
   ===================================================== */

.empty {

    text-align:
        center;

    padding:
        35px 15px;

    color:
        #666;

}


.empty-icon {

    font-size:
        2.5rem;

    margin-bottom:
        10px;

}


.empty-text {

    font-size:
        .85rem;

}


/* =====================================================
   REMOVIDAS
   ===================================================== */

.removed-area {

    margin-top:
        30px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid #252525;

    border-radius:
        15px;

    padding:
        15px;

}


.removed-title {

    color:
        #777;

    font-size:
        .75rem;

    font-weight:
        900;

    text-transform:
        uppercase;

    margin-bottom:
        10px;

}


.removed-item {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

    padding:
        8px 0;

    border-bottom:
        1px solid #222;

    font-size:
        .8rem;

    color:
        #777;

}


.btn-restore {

    color:
        var(--secondary);

    border-color:
        var(--secondary);

    box-shadow:
        none;

    padding:
        6px 10px;

    font-size:
        .65rem;

}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width: 480px) {

    body {

        padding:
            8px;

    }


    .top-menu {

        gap:
            7px;

    }


    button {

        font-size:
            .65rem;

    }


    .nota-row {

        grid-template-columns:
            minmax(0,1fr)
            52px
            58px
            28px;

        gap:
            4px;

    }


    .nota-row input {

        padding:
            8px 5px;

        font-size:
            .72rem;

    }


    .materia-card {

        padding:
            14px;

    }


    .np-box {

        padding:
            11px;

    }


    .resumo-numero {

        font-size:
            1.15rem;

    }


    .status-badge {

        font-size:
            .65rem;

        padding:
            8px 12px;

    }

}


/* =====================================================
   TELAS MUITO PEQUENAS
   ===================================================== */

@media (max-width: 360px) {

    .nota-row {

        grid-template-columns:
            1fr 48px 52px 24px;

    }


    .nota-row input {

        font-size:
            .68rem;

    }


    .top-menu {

        grid-template-columns:
            1fr;

    }

}


/* =====================================================
   RELATÓRIO
   ===================================================== */

.relatorio-preview {

    margin-top:
        25px;

}


/* =====================================================
   IMPRESSÃO
   ===================================================== */

@media print {

    body {

        background:
            white !important;

        color:
            #111 !important;

    }


    .top-menu,
    .semestre-area,
    #removed-container,
    .btn-delete-materia,
    .btn-add-np,
    .btn-add-nota,
    .btn-del-small {

        display:
            none !important;

    }


    .materia-card {

        background:
            white !important;

        color:
            #111 !important;

        box-shadow:
            none;

        border:
            1px solid #ccc;

        break-inside:
            avoid;

    }

}


/* =====================================================
   FIM CSS
   ===================================================== */

</style>

</head>


<body>

<div class="container">

<h1>
    📊 HISTÓRICO DE NOTAS
</h1>


<div class="top-menu">

    <button
        class="btn-back"
        onclick="window.location.href='index.html'">

        ⬅️ VOLTAR AO PLANNER

    </button>


    <button
        class="btn-download"
        onclick="baixarHistorico()">

        📥 SALVAR RELATÓRIO

    </button>

</div>


<div class="semestre-area">

    <span class="semestre-label">
        Semestre atual
    </span>


    <input
        type="text"
        id="input-semestre"
        class="semestre-input"
        value="2026.1"
        placeholder="2026.1"
        maxlength="15"
    >

</div>


<div
    id="resumo"
    class="resumo">
</div>


<div
    id="materias-container">
</div>


<div
    id="removed-container">
</div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

const STORAGE_KEY =
    'ufc_sistema_notas_v2';

const TRANSPORTE_KEY =
    'ufc_materias_transporte';

const OLD_STORAGE_KEY =
    'ufc_sistema_notas_v1';


/* =====================================================
   ESTRUTURA INICIAL
   ===================================================== */

const estruturaInicial = {

    version:
        2,

    semestre:
        '2026.1',

    materias:
        {},

    removidas:
        {}

};


/* =====================================================
   UTILITÁRIOS
   ===================================================== */

function gerarId(prefixo = 'id') {

    if (
        typeof crypto !== 'undefined' &&
        crypto.randomUUID
    ) {

        return `${prefixo}-${crypto.randomUUID()}`;

    }


    return `${prefixo}-${Date.now()}-${
        Math.random()
            .toString(36)
            .substring(2,10)
    }`;

}


function escapeHTML(valor) {

    return String(valor ?? '')

        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


function numero(valor) {

    if (
        valor === '' ||
        valor === null ||
        valor === undefined
    ) {

        return null;

    }


    const n =
        parseFloat(
            String(valor)
                .replace(',','.')
        );


    return Number.isFinite(n)
        ? n
        : null;

}


function limitarNota(valor) {

    const n =
        numero(valor);


    if (
        n === null
    ) {

        return '';

    }


    return Math.max(
        0,
        Math.min(10,n)
    );

}


/* =====================================================
   NORMALIZAÇÃO
   ===================================================== */

function normalizarParcial(parcial) {

    return {

        id:
            parcial?.id ||
            gerarId('np'),

        nome:
            String(
                parcial?.nome ||
                'Nova Etapa'
            ),

        notas:
            Array.isArray(
                parcial?.notas
            )
                ? parcial.notas.map(
                    nota => ({

                        id:
                            nota?.id ||
                            gerarId('nota'),

                        tipo:
                            String(
                                nota?.tipo || ''
                            ),

                        peso:
                            nota?.peso ??
                            1,

                        valor:
                            nota?.valor ??
                            ''

                    })
                )
                : [],

        af:
            parcial?.af ??
            ''

    };

}


function normalizarMateria(
    materia,
    id
) {

    return {

        id,

        nome:
            String(
                materia?.nome ||
                'Matéria'
            ),

        parciais:
            Array.isArray(
                materia?.parciais
            )
                ? materia.parciais.map(
                    normalizarParcial
                )
                : []

    };

}


function normalizarDados(dados) {

    const resultado = {

        version:
            2,

        semestre:
            String(
                dados?.semestre ||
                '2026.1'
            ),

        materias:
            {},

        removidas:
            {}

    };


    if (
        dados?.materias &&
        typeof dados.materias === 'object'
    ) {

        Object.entries(
            dados.materias
        ).forEach(
            ([id,materia]) => {

                resultado.materias[id] =
                    normalizarMateria(
                        materia,
                        id
                    );

            }
        );

    }


    if (
        dados?.removidas &&
        typeof dados.removidas === 'object'
    ) {

        Object.entries(
            dados.removidas
        ).forEach(
            ([id,materia]) => {

                resultado.removidas[id] = {

                    id,

                    nome:
                        String(
                            materia?.nome || ''
                        )

                };

            }
        );

    }


    return resultado;

}


/* =====================================================
   MIGRAÇÃO
   ===================================================== */

function migrarVersaoAntiga(antigo) {

    const novo =
        structuredClone(
            estruturaInicial
        );


    const semestre =
        localStorage.getItem(
            'ufc_semestre'
        );


    if (semestre) {

        novo.semestre =
            semestre;

    }


    if (
        antigo &&
        typeof antigo === 'object'
    ) {

        Object.entries(
            antigo
        ).forEach(
            ([nome,materia]) => {

                const id =
                    gerarId('mat');


                novo.materias[id] = {

                    id,

                    nome,

                    parciais:
                        Array.isArray(
                            materia?.parciais
                        )
                            ? materia.parciais.map(
                                normalizarParcial
                            )
                            : []

                };

            }
        );

    }


    return novo;

}


/* =====================================================
   CARREGAR
   ===================================================== */

function carregarDados() {

    try {

        const salvo =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (salvo) {

            return normalizarDados(
                JSON.parse(salvo)
            );

        }


        const antigo =
            localStorage.getItem(
                OLD_STORAGE_KEY
            );


        if (antigo) {

            const migrado =
                migrarVersaoAntiga(
                    JSON.parse(antigo)
                );


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(migrado)
            );


            return migrado;

        }

    } catch(erro) {

        console.error(
            'Erro ao carregar notas:',
            erro
        );

    }


    return structuredClone(
        estruturaInicial
    );

}


let dados =
    carregarDados();


/* =====================================================
   SALVAR
   ===================================================== */

function salvar() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(dados)
    );


    localStorage.setItem(
        'ufc_semestre',
        dados.semestre
    );

}


/* =====================================================
   PLANNER
   ===================================================== */

function obterMateriasPlanner() {

    try {

        const salvo =
            localStorage.getItem(
                TRANSPORTE_KEY
            );


        if (!salvo) {

            return [];

        }


        const lista =
            JSON.parse(salvo);


        if (
            !Array.isArray(lista)
        ) {

            return [];

        }


        return lista.map(
            item => {

                if (
                    typeof item === 'string'
                ) {

                    return {

                        id:
                            'legacy-' +
                            item,

                        nome:
                            item

                    };

                }


                return {

                    id:
                        item?.id ||
                        'legacy-' +
                        item?.nome,

                    nome:
                        String(
                            item?.nome || ''
                        )

                };

            }
        );

    } catch(erro) {

        console.error(
            'Erro no Planner:',
            erro
        );

        return [];

    }

}


function sincronizar() {

    const materias =
        obterMateriasPlanner();


    let alterou =
        false;


    materias.forEach(
        materia => {

            if (
                !materia.id ||
                !materia.nome.trim()
            ) {

                return;

            }


            if (
                dados.removidas[
                    materia.id
                ]
            ) {

                return;

            }


            if (
                !dados.materias[
                    materia.id
                ]
            ) {

                dados.materias[
                    materia.id
                ] = {

                    id:
                        materia.id,

                    nome:
                        materia.nome,

                    parciais:
                        []

                };


                alterou =
                    true;

            } else {

                if (
                    dados.materias[
                        materia.id
                    ].nome !==
                    materia.nome
                ) {

                    dados.materias[
                        materia.id
                    ].nome =
                        materia.nome;


                    alterou =
                        true;

                }

            }

        }
    );


    if (alterou) {

        salvar();

    }

}


/* =====================================================
   CÁLCULO DA ETAPA
   ===================================================== */

function calcularEtapa(parcial) {

    let soma =
        0;

    let pesos =
        0;


    const faltantes =
        [];


    parcial.notas.forEach(
        nota => {

            const peso =
                numero(nota.peso) ||
                0;


            const valor =
                numero(nota.valor);


            if (
                peso <= 0
            ) {

                return;

            }


            if (
                valor === null
            ) {

                faltantes.push({

                    id:
                        nota.id,

                    tipo:
                        nota.tipo ||
                        'Próxima nota',

                    peso

                });

            } else {

                soma +=
                    valor * peso;

                pesos +=
                    peso;

            }

        }
    );


    const pesosFaltantes =
        faltantes.reduce(
            (total,item) =>
                total + item.peso,
            0
        );


    const pesoTotal =
        pesos +
        pesosFaltantes;


    const mediaAtual =
        pesos > 0
            ? soma / pesos
            : null;


    let meta =
        null;


    if (
        pesosFaltantes > 0 &&
        pesoTotal > 0
    ) {

        meta =
            (
                7 * pesoTotal -
                soma
            ) /
            pesosFaltantes;

    }


    let mediaFinal =
        null;


    if (
        pesoTotal > 0 &&
        pesosFaltantes === 0
    ) {

        mediaFinal =
            soma / pesoTotal;

    }


    return {

        soma,

        pesos,

        pesosFaltantes,

        pesoTotal,

        faltantes,

        mediaAtual,

        mediaFinal,

        meta

    };

}


/* =====================================================
   MÉDIA DAS APs
   ===================================================== */

function calcularMediaAPs(materia) {

    const etapas =
        materia.parciais
            .map(calcularEtapa)
            .filter(
                etapa =>
                    etapa.mediaFinal !== null
            );


    if (
        etapas.length === 0
    ) {

        return null;

    }


    const soma =
        etapas.reduce(
            (total,etapa) =>
                total +
                etapa.mediaFinal,
            0
        );


    return soma /
        etapas.length;

}


/* =====================================================
   AF
   ===================================================== */

function calcularAFnecessaria(mediaAP) {

    if (
        mediaAP === null
    ) {

        return null;

    }


    if (
        mediaAP < 4
    ) {

        return null;

    }


    return Math.max(
        4,
        10 - mediaAP
    );

}


/* =====================================================
   STATUS
   ===================================================== */

function obterStatus(mediaAP) {

    if (
        mediaAP === null
    ) {

        return {

            classe:
                'recuperacao',

            texto:
                'AGUARDANDO NOTAS'

        };

    }


    if (
        mediaAP >= 7
    ) {

        return {

            classe:
                'aprovado',

            texto:
                'APROVADO POR MÉDIA 🏆'

        };

    }


    if (
        mediaAP >= 4
    ) {

        return {

            classe:
                'recuperacao',

            texto:
                'POSSÍVEL AVALIAÇÃO FINAL'

        };

    }


    return {

        classe:
            'reprovado',

        texto:
            'ABAIXO DE 4,0'

    };

}

) {

    const calculo =

                        )"

                    <input
                        type="number"
                        min="0"
                        max="10"
                        step="0.1"
                        placeholder="Nota"
                        value="${escapeHTML(
                            nota.valor
                        )}"

                            '${escapeHTML(materia.id)}',

                            'valor',

                        )"

                    <button

                            '${escapeHTML(materia.id)}',
                            '${escapeHTML(parcial.id)}',
                            '${escapeHTML(nota.id)}'
                        )">

                        ×

                    </button>

                </div>

            `;

        }
    );


    let resultadoHTML =
        '';


    if (
        calculo.faltantes.length > 0 &&
        calculo.pesoTotal > 0
    ) {

        const meta =
            calculo.meta;


        if (
            meta <= 10
        ) {

            resultadoHTML = `

                <div class="previsao-tag">

                    🎯 Para fechar esta etapa
                    com <b>7,0</b>:

                    média de

                    <b>
                        ${Math.max(
                            0,
                            meta
                        ).toFixed(1)}
                    </b>

                    nas próximas notas.

                </div>

            `;

        } else {

            resultadoHTML = `

                <div
                    class="
                        previsao-tag
                        previsao-impossivel
                    ">

                    ⚠️ Mesmo tirando 10,0
                    nas notas restantes,
                    7,0 não será atingido.

                </div>

            `;

        }

    } else if (
        calculo.mediaFinal !== null
    ) {

        let classe =
            'media-boa';


        if (
            calculo.mediaFinal < 4
        ) {

            classe =
                'media-ruim';

        } else if (
            calculo.mediaFinal < 7
        ) {

            classe =
                'media-baixa';

        }


        resultadoHTML = `

            <div
                class="
                    media-etapa
                    ${classe}
                ">

                Média da etapa:

                ${calculo.mediaFinal.toFixed(1)}

            </div>

        `;

    }


    return `

        <div class="np-box">

            <div class="np-header">

                <input
                    class="np-title"
                    type="text"
                    value="${escapeHTML(
                        parcial.nome
                    )}"

                        '${escapeHTML(materia.id)}',
                        '${escapeHTML(parcial.id)}',
                        this.value
                    )"

                <button
                    class="btn-del-small"

                        '${escapeHTML(materia.id)}',
                        '${escapeHTML(parcial.id)}'

            ${
                notasHTML ||

                `

                        class="empty-text"
                        style="
                            color:#666;
                            text-align:center;
                            padding:10px;
                        ">

                        Nenhuma avaliação cadastrada.

                    </div>

                `
            }


            ${resultadoHTML}


            <button
                class="btn-add-nota"
                onclick="adicionarNota(
                    '${escapeHTML(materia.id)}',
                    '${escapeHTML(parcial.id)}'
                )">

                + ADICIONAR NOTA

            </button>

        </div>

    `;

}

function adicionarNP(materiaId) {

    const materia =
        dados.materias[
            materiaId
        ];


    if (!materia) {

        return;

    }


    materia.parciais.push({

        id:
            gerarId('np'),

        nome:
            `NP${materia.parciais.length + 1}`,

        notas:
            [],

        af:
            ''

    });


    salvar();

    renderizar();

}


/* =====================================================
   REMOVER NP
   ===================================================== */

function removerNP(
    materiaId,
    parcialId
) {

    const materia =
        dados.materias[
            materiaId
        ];


    if (!materia) {

        return;

    }


    const parcial =
        materia.parciais.find(
            p =>
                p.id === parcialId
        );


    if (!parcial) {

        return;

    }


    if (
        !confirm(
            `Remover a etapa "${parcial.nome}"?`
        )
    ) {

        return;

    }


    materia.parciais =
        materia.parciais.filter(
            p =>
                p.id !== parcialId
        );


    salvar();

    renderizar();

}

/* =====================================================
   ATUALIZAR NOTA
   ===================================================== */

function atualizarNota(
    materiaId,
    parcialId,
    notaId,
    campo,
    valor
) {

    const materia =
        dados.materias[
            materiaId
        ];


    if (!materia) {

        return;

    }


    const parcial =
        materia.parciais.find(
            p =>
                p.id === parcialId
        );


    if (!parcial) {

        return;

    }


    const nota =
        parcial.notas.find(
            n =>
                n.id === notaId
        );


    if (!nota) {

        return;

    }


    if (
        campo === 'valor'
    ) {

        nota.valor =
            valor === ''
                ? ''
                : limitarNota(valor);

    } else if (
        campo === 'peso'
    ) {

        const peso =
            numero(valor);


        nota.peso =
            peso === null
                ? 0
                : Math.max(
                    0,
                    peso
                );

    } else {

        nota[campo] =
            String(valor);

    }


    salvar();

    renderizar();

}

) {

    const materia =
        dados.materias[

    if (!materia) {

        return;

    }


    const confirmou =
        confirm(
            `APAGAR COMPLETAMENTE?\n\n` +
            `${materia.nome}\n\n` +
            `Todas as NP, notas e dados dessa matéria ` +
            `serão removidos.\n\n` +
            `Ela poderá ser restaurada depois.`
        );


    if (!confirmou) {

        return;

    }


    delete dados.materias[
        materiaId
    ];


    dados.removidas[
        materiaId
    ] = {

        id:
            materiaId,

        nome:
            materia.nome

    };


    salvar();

    renderizar();

/* =====================================================
   GERAR MATÉRIA DO RELATÓRIO
   ===================================================== */

function gerarMateriaRelatorio(
    materia
) {

    const mediaAP =
        calcularMediaAPs(
            materia
        );


    let statusClasse =
        'aguardando';


    let statusTexto =
        'AGUARDANDO NOTAS';


    if (
        mediaAP !== null
    ) {

        if (
            mediaAP >= 7
        ) {

            statusClasse =
                'aprovado';

            statusTexto =
                'APROVADO POR MÉDIA 🏆';

        } else if (
            mediaAP >= 4
        ) {

            statusClasse =
                'atencao';

            statusTexto =
                'POSSÍVEL AVALIAÇÃO FINAL';

        } else {

            statusClasse =
                'reprovado';

            statusTexto =
                'ABAIXO DE 4,0';

        }

    }


    let etapasHTML =
        '';


    materia.parciais.forEach(
        parcial => {

            const calculo =
                calcularEtapa(
                    parcial
                );


            let linhas =
                '';


            parcial.notas.forEach(
                nota => {

                    const valor =
                        nota.valor === ''
                            ? 'Pendente'
                            : numero(nota.valor) !== null
                                ? numero(nota.valor).toFixed(1)
                                : nota.valor;


                    linhas += `

                        <tr>

                            <td>
                                ${escapeHTML(
                                    nota.tipo ||
                                    'Avaliação'
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    nota.peso
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    valor
                                )}
                            </td>

                        </tr>

                    `;

                }
            );


            if (
                !linhas
            ) {

                linhas = `

                    <tr>

                        <td colspan="3"
                            style="
                                text-align:center;
                                color:#666;
                            ">

                            Nenhuma avaliação cadastrada.

                        </td>

                    </tr>

                `;

            }


            let resultado =
                '';


            if (
                calculo.mediaFinal !== null
            ) {

                resultado = `

                    <div class="media-etapa">

                        Média da etapa:

                        <strong>
                            ${calculo.mediaFinal.toFixed(1)}
                        </strong>

                    </div>

                `;

            } else if (
                calculo.meta !== null
            ) {

                resultado = `

                    <div class="media-etapa">

                        🎯 Média necessária para 7,0:

                        <strong>
                            ${calculo.meta.toFixed(1)}
                        </strong>

                    </div>

                `;

            }


            etapasHTML += `

                <div class="etapa">

                    <h3>

                        ${escapeHTML(
                            parcial.nome
                        )}

                    </h3>


                    <table class="tabela">

                        <thead>

                            <tr>

                                <th>
                                    Avaliação
                                </th>

                                <th>
                                    Peso
                                </th>

                                <th>
                                    Nota
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${linhas}

                        </tbody>

                    </table>


                    ${resultado}

                </div>

            `;

        }
    );


    let afHTML =
        '';


    if (
        mediaAP !== null &&
        mediaAP >= 4 &&
        mediaAP < 7
    ) {

        const afNecessaria =
            calcularAFnecessaria(
                mediaAP
            );


        afHTML = `

            <div class="af">

                🎯 Nota mínima necessária na AF:

                <strong>
                    ${afNecessaria.toFixed(1)}
                </strong>

            </div>

        `;

    }


    return `

        <section class="materia">

            <h2>

                📚 ${escapeHTML(
                    materia.nome
                )}

            </h2>


            <div class="materia-id">

                ${escapeHTML(
                    materia.id
                )}

            </div>


            ${etapasHTML}


            <div class="media">

                <div>
                    Média das APs
                </div>


                <div class="media-numero">

                    ${
                        mediaAP === null
                            ? '—'
                            : mediaAP.toFixed(1)
                    }

                </div>


                <div>

                    <span
                        class="
                            status
                            ${statusClasse}
                        ">

                        ${statusTexto}

                    </span>

                </div>


                ${afHTML}

            </div>

        </section>

    `;

}
